server{
	listen 80;
        server_name _;
        client_max_body_size 100M;
        location = /favicon.ico {access_log off; log_not_found off; }

	# Configuration for original

	location /course_vm/cs433/static/{
                alias /home/user/randomAttendance/static/;
        }
        location /course_vm/cs433/images/{
                alias /home/user/randomAttendance/studenthome/images/;
        }

	location /course_vm/cs433/ {
                include proxy_params;
                proxy_read_timeout 300s;
                proxy_connect_timeout 75s;
                proxy_pass http://unix:/home/user/randomAttendance/attendance.sock;
        }
	


}

