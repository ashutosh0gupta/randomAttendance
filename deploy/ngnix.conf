server{
	listen 80;
        server_name _;
        client_max_body_size 100M;
        location = /favicon.ico {access_log off; log_not_found off; }

	# Configuration for original

	location /course_vm/cs213/static/{
                alias /home/user/randomAttendance/static/;
        }
        location /course_vm/cs213/images/{
                alias /home/user/randomAttendance/studenthome/images/;
        }

	location /course_vm/cs213/ {
                include proxy_params;
                proxy_read_timeout 300s;
                proxy_connect_timeout 75s;
                proxy_pass http://unix:/home/user/randomAttendance/attendance.sock;
        }
	
	location /course_vm/cs213/license/ {
                proxy_pass http://127.0.0.1:8000/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Prefix /course_vm/cs213/license;
        }

}

